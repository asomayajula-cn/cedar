# Canonical layer map — first matching path wins (list specific / inner layers before broad globs).

components:
  - id: migrations
    name: Schema & migrations
    paths:
      - "migrations/**"
      - "**/migrations/**/*.sql"
      - "**/db/migration/**"
      - "**/db/changelog/**"
      - "**/src/main/resources/db/migration/**"
      - "**/src/main/resources/db/changelog/**"
      - "**/flyway/**"
      - "**/liquibase/**"
      - "**/supabase/migrations/**"
      - "**/prisma/migrations/**"
      - "**/schema/migrations/**"
      - "**/sql/migrations/**"
      - "**/V*__*.sql"
    depends_on: [domain]

  - id: domain
    name: Domain layer
    paths:
      - "**/src/main/java/**/domain/**"
      - "**/src/main/java/**/model/**"
      - "**/src/main/java/**/entity/**"
      - "internal/domain/**"
      - "src/domain/**"
    depends_on: []

  - id: application
    name: Application layer
    paths:
      - "**/src/main/java/**/application/**"
      - "**/src/main/java/**/port/**"
      - "**/src/main/java/**/service/**"
      - "**/src/main/java/**/services/**"
      - "**/src/main/java/**/mapper/**"
      - "**/src/main/java/**/shift/**"
      - "**/src/main/java/**/usecase/**"
      - "**/src/main/java/**/usecases/**"
      - "internal/application/**"
      - "internal/usecase/**"
    depends_on: [domain]

  - id: repository
    name: Repository & data access
    paths:
      - "**/src/main/java/**/repository/**"
      - "**/src/main/java/**/persistence/**"
      - "**/src/main/java/**/data/**"
      - "**/src/main/java/**/dao/**"
      - "**/src/main/java/**/jpa/**"
      - "**/*Repository.java"
      - "**/*Repository.kt"
      - "internal/store/**"
      - "**/seeds/**/*.sql"
      - "**/fixtures/**/*.sql"
      - "**/testdata/**/*.sql"
    depends_on: [domain, application]

  - id: infrastructure
    name: Infrastructure adapters
    paths:
      - "**/src/main/java/**/infrastructure/**"
      - "**/src/main/java/**/adapter/**"
      - "**/src/main/java/**/client/**"
      - "**/src/main/java/**/log/**"
      - "**/src/main/java/**/exception/**"
      - "**/META-INF/spring.factories"
    depends_on: [domain, application, repository]

  - id: api
    name: API & HTTP adapters
    paths:
      - "**/src/main/java/**/api/**"
      - "api/**"
      - "internal/handlers/**"
      - "src/routes/**"
    depends_on: [application, domain]

  - id: persistence
    name: Persistence models
    paths:
      - "db/**"
      - "**/persistence/**"
      - "**/schemas/**/*.sql"
      - "**/*.sql"
      - "**/prisma/**"
      - "**/drizzle/**"
    depends_on: [domain]

  - id: config
    name: Runtime config · 12-factor (III)
    paths:
      - "**/src/main/java/**/config/**"
      - "**/src/main/java/**/properties/**"
      - "**/src/main/resources/application*.yml"
      - "**/src/main/resources/application*.yaml"
      - "**/src/main/resources/application*.properties"
      - "**/application*.yml"
      - "**/application*.yaml"
      - "**/application*.properties"
      - "**/logging-configuration.json"
      - ".env.example"
    depends_on: []

  - id: build_deploy
    name: Build & release · 12-factor (V)
    paths:
      - "**/pom.xml"
      - "**/build.gradle*"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "Procfile"
      - ".github/workflows/**"
      - ".gitignore"
    depends_on: []

  - id: integration
    name: Contracts & integration
    paths:
      - "contracts/**"
      - "proto/**"
      - "openapi/**"
      - "**/*.openapi.yaml"
    depends_on: [api, domain]

  - id: web
    name: Web & UI
    paths:
      - "web/**"
      - "apps/web/**"
      - "src/components/**"
    depends_on: [api]

  - id: infra
    name: Platform & ops · 12-factor
    paths:
      - "infra/**"
      - "terraform/**"
      - "k8s/**"
      - "docker/**"
      - ".github/**"
    depends_on: []

  - id: tests
    name: Tests
    paths:
      - "**/src/test/**"
      - "**/contract-test/**"
      - "**/__tests__/**"
      - "**/*.test.ts"
      - "**/*.spec.ts"
    depends_on: []

  - id: misc
    name: Unclassified changes
    paths: []
    depends_on: []

default_component: misc