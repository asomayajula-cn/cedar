# DDD + 12-factor — matches examples/Spring Boot package layout (first match wins).

components:
  - id: domain
    name: Domain layer · DDD
    paths:
      - "**/src/main/java/**/domain/**"
      - "internal/domain/**"
      - "src/domain/**"
    depends_on: []

  - id: application
    name: Application layer · DDD
    paths:
      - "**/src/main/java/**/application/**"
      - "**/src/main/java/**/port/**"
      - "internal/application/**"
      - "internal/usecase/**"
    depends_on: [domain]

  - id: infrastructure
    name: Infrastructure · DDD
    paths:
      - "**/src/main/java/**/infrastructure/**"
      - "internal/store/**"
    depends_on: [domain, application]

  - id: api
    name: API adapters · DDD
    paths:
      - "**/src/main/java/**/api/**"
      - "api/**"
      - "internal/handlers/**"
      - "src/routes/**"
    depends_on: [application, domain]

  - id: config
    name: Runtime config · 12-factor
    paths:
      - "**/src/main/resources/**"
      - "**/application*.yml"
      - "**/application*.yaml"
      - "**/application*.properties"
      - ".env.example"
    depends_on: []

  - id: build_deploy
    name: Build & release · 12-factor
    paths:
      - "**/pom.xml"
      - "**/build.gradle*"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "Procfile"
    depends_on: []

  - id: persistence
    name: Persistence & migrations
    paths:
      - "migrations/**"
      - "db/**"
      - "**/src/main/resources/db/**"
    depends_on: [domain]

  - id: web
    name: Web & UI
    paths:
      - "web/**"
      - "apps/web/**"
      - "src/components/**"
    depends_on: [api]

  - id: infra
    name: Platform & ops · 12-factor
    paths:
      - ".github/**"
      - "terraform/**"
      - "k8s/**"
      - "docker/**"
    depends_on: []

  - id: integration
    name: Contracts & integration
    paths:
      - "contracts/**"
      - "proto/**"
      - "openapi/**"
      - "**/*.openapi.yaml"
    depends_on: [api, domain]

default_component: misc